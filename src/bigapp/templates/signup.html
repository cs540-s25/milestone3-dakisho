<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign Up - Movie Discovery</title>
  <link rel="stylesheet" href="https://cdn.simplecss.org/simple.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600&display=swap">
  <style>
    :root {
      /* Base colors */
      --paper: #FFFCF0;
      --bg: #F2F0E5;
      --bg-2: #E6E4D9;
      --ui: #DAD8CE;
      --ui-2: #B7B5AC;
      --tx: #282726;
      --tx-2: #6F6E69;
      --tx-3: #878580;

      /* Accent colors */
      --blue: #4385BE;
      --cyan: #3AA99F;
      --purple: #8B7EC8;
      --red: #D14D41;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--bg);
      color: var(--tx);
      line-height: 1.6;
    }

    header {
      text-align: center;
      padding: 2rem 0;
      background: linear-gradient(to right, var(--blue), var(--purple));
      color: var(--paper);
      margin-bottom: 2rem;
      border-radius: 0 0 1rem 1rem;
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
      font-weight: 600;
    }

    .form-container {
      max-width: 500px;
      margin: 0 auto;
      background-color: var(--paper);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 4px 6px rgba(40, 39, 38, 0.05);
      border: 1px solid var(--ui);
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--ui-2);
      border-radius: 0.5rem;
      font-family: inherit;
      font-size: 1rem;
    }

    .submit-btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background-color: var(--blue);
      color: var(--paper);
      text-decoration: none;
      border-radius: 2rem;
      transition: all 0.2s ease;
      font-weight: 600;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      width: 100%;
      margin-top: 1rem;
    }

    .submit-btn:hover {
      background-color: var(--purple);
      transform: translateY(-2px);
    }

    .message {
      margin-top: 1.5rem;
      text-align: center;
    }

    .message a {
      color: var(--blue);
      text-decoration: none;
      font-weight: 600;
    }

    .message a:hover {
      text-decoration: underline;
    }

    .flash-message {
      background-color: var(--red);
      color: var(--paper);
      padding: 0.75rem;
      border-radius: 0.5rem;
      margin-bottom: 1.5rem;
    }
  </style>
</head>

<body>
  <header>
    <h1>Movie Discovery</h1>
  </header>

  <main>
    <div class="form-container">
      <h2>Sign Up</h2>
      
      {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-message">
          {{ messages[0] }}
        </div>
      {% endif %}
      {% endwith %}
      
      <form method="POST" action="/signup">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required>
        </div>
        
        <button type="submit" class="submit-btn">Sign Up</button>
      </form>
      
      <div class="message">
        Already have an account? <a href="{{ url_for('auth.login') }}">Log In</a>
      </div>
    </div>
  </main>
</body>
</html>
